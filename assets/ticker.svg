<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="Browser games, useful software, Android and web, hard problems, no deadlines">
  <defs>
    <clipPath id="box"><rect width="900" height="44" rx="10"/></clipPath>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080D40" stop-opacity="1"/>
      <stop offset="1" stop-color="#080D40" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#080D40" stop-opacity="1"/>
      <stop offset="1" stop-color="#080D40" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#box)">
    <rect width="900" height="44" fill="#080D40"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#D2B64C" fill-opacity="0.92">
      <text x="0" y="28" textLength="1000" lengthAdjust="spacing">BROWSER&#160;GAMES&#160;&#160;/&#160;&#160;USEFUL&#160;SOFTWARE&#160;&#160;/&#160;&#160;ANDROID&#160;AND&#160;WEB&#160;&#160;/&#160;&#160;HARD&#160;PROBLEMS&#160;&#160;/&#160;&#160;NO&#160;DEADLINES&#160;&#160;/&#160;&#160;</text>
      <text x="1000" y="28" textLength="1000" lengthAdjust="spacing">BROWSER&#160;GAMES&#160;&#160;/&#160;&#160;USEFUL&#160;SOFTWARE&#160;&#160;/&#160;&#160;ANDROID&#160;AND&#160;WEB&#160;&#160;/&#160;&#160;HARD&#160;PROBLEMS&#160;&#160;/&#160;&#160;NO&#160;DEADLINES&#160;&#160;/&#160;&#160;</text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="28s" repeatCount="indefinite"/>
    </g>
    <rect width="90" height="44" fill="url(#fadeL)"/>
    <rect x="810" width="90" height="44" fill="url(#fadeR)"/>
  </g>
  <rect x="1" y="1" width="898" height="42" rx="9" fill="none" stroke="#BB9A23" stroke-opacity="0.6"/>
</svg>
