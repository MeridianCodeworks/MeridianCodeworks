<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Meridian Codeworks. Hobby first. Ambition anyway.">
  <title>Meridian Codeworks</title>
  <defs>
    <clipPath id="panel"><rect width="900" height="320" rx="18"/></clipPath>
    <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V40" fill="none" stroke="#BBBBBB" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2B64C"/>
      <stop offset="0.55" stop-color="#BB9A23"/>
      <stop offset="1" stop-color="#8D741A"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BB9A23" stop-opacity="0"/>
      <stop offset="1" stop-color="#D2B64C" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#BBBBBB"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BBBBBB"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="900" height="320" fill="#080D40"/>
    <rect width="900" height="320" fill="url(#grid)"/>
    <path d="M450 0V320" stroke="#BB9A23" stroke-opacity="0.2" stroke-dasharray="3 7"/>

    <g fill="#D2B64C">
      <circle cx="90" cy="70" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="260" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="48" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="52" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="262" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="80" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="200" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="200" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
    </g>

    <g>
      <rect x="-120" y="0" width="120" height="320" fill="url(#sweep)"/>
      <rect x="-2" y="0" width="2" height="320" fill="#D2B64C"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1020 0" dur="7s" repeatCount="indefinite"/>
    </g>

    <ellipse cx="450" cy="160" rx="400" ry="105" fill="none" stroke="#BB9A23" stroke-opacity="0.28" stroke-dasharray="2 8"/>

    <g>
      <circle r="14" fill="#BB9A23" opacity="0.18"/>
      <circle r="6" fill="url(#gold)"/>
      <animateMotion dur="14s" begin="0s" repeatCount="indefinite" path="M850,160 A400,105 0 1,1 50,160 A400,105 0 1,1 850,160"/>
    </g>
    <g>
      <circle r="14" fill="#BB9A23" opacity="0.18"/>
      <circle r="6" fill="url(#gold)"/>
      <animateMotion dur="14s" begin="-4.67s" repeatCount="indefinite" path="M850,160 A400,105 0 1,1 50,160 A400,105 0 1,1 850,160"/>
    </g>
    <g>
      <circle r="14" fill="#BB9A23" opacity="0.18"/>
      <circle r="6" fill="url(#gold)"/>
      <animateMotion dur="14s" begin="-9.33s" repeatCount="indefinite" path="M850,160 A400,105 0 1,1 50,160 A400,105 0 1,1 850,160"/>
    </g>

    <text x="450" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="4" fill="url(#shine)">MERIDIAN CODEWORKS</text>
    <text x="450" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="7" fill="#D2B64C" opacity="0">
      HOBBY FIRST. AMBITION ANYWAY.
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
    </text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#BBBBBB" fill-opacity="0.75">
      <text x="38" y="40">STATION  ISLAMABAD, PAKISTAN</text>
      <text x="862" y="40" text-anchor="end">CREW 03  /  STATUS HOBBY</text>
      <text x="38" y="294">33.6844&#176; N   73.0479&#176; E</text>
      <text x="862" y="294" text-anchor="end">LOGGED 2026</text>
    </g>
    <rect x="212" y="283" width="8" height="14" fill="#D2B64C">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>

    <g fill="none" stroke="#BB9A23" stroke-width="2" stroke-linecap="round">
      <path d="M16 36V16H36"/>
      <path d="M864 16H884V36"/>
      <path d="M16 284V304H36"/>
      <path d="M884 284V304H864"/>
    </g>
  </g>
  <rect x="1" y="1" width="898" height="318" rx="17" fill="none" stroke="url(#gold)" stroke-width="2"/>
</svg>
